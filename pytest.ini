[pytest]
; pytest-homeassistant's fixtures are async; the HA core suite itself runs in auto mode.
asyncio_mode = auto
asyncio_default_fixture_loop_scope = function
; The harness asks for respx's own pytest plugin to be off (it imports httpx before the harness can alias it); nothing here uses respx.
addopts = -p no:respx
; `custom_components` is at the root of the repository.
pythonpath = .
testpaths = tests
norecursedirs = __pycache__ .git node_modules
