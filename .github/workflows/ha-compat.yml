name: HA compatibility

# The tests, against the newest stable Home Assistant and against its newest beta (or release candidate): a Home Assistant release that breaks
# this integration is seen here before it reaches the house. (`validate.yml` has hassfest, HACS and the lint.)
on:
  push:
  pull_request:
  schedule:
    # Weekly. The beta leg fails here about a week before a breaking Home Assistant release.
    - cron: "17 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    name: pytest (HA ${{ matrix.channel }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        channel: [stable, beta]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: Install Home Assistant, its test harness and the integration's own requirements
        run: |
          uv venv -p 3.14
          python3 -c "import json,glob; [print(r) for f in glob.glob('custom_components/*/manifest.json') for r in json.load(open(f)).get('requirements', [])]" > manifest-requirements.txt
          prerelease=""
          if [ "${{ matrix.channel }}" = "beta" ]; then prerelease="--prerelease=allow"; fi
          uv pip install $prerelease "pytest-homeassistant[bluetooth]" pytest-timeout -r manifest-requirements.txt
      - name: Install what the tests load from Home Assistant
        run: |
          # The camera component imports these when the integration asks a camera for a stream address. The alarms' store is Home Assistant's Local
          # Calendar: its library is the version that Home Assistant release names, which is read from the release that was installed.
          uv run --no-project python - <<'EOF' > component-requirements.txt
          import json
          import pathlib

          import homeassistant

          components = pathlib.Path(homeassistant.__file__).parent / "components"
          for domain in ("local_calendar",):
              print(*json.loads((components / domain / "manifest.json").read_text())["requirements"], sep="\n")
          EOF
          uv pip install PyTurboJPEG pillow -r component-requirements.txt
      - run: uv run --no-project python -c "import homeassistant.const as c; print('Home Assistant', c.__version__)"
      - run: uv run --no-project pytest --timeout=120
